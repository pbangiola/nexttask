<svg id="pairwise-sorting" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 598px;" viewBox="4 4 598 214" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#pairwise-sorting{font-family:Arial,sans-serif;font-size:16px;fill:#171717;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#pairwise-sorting .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#pairwise-sorting .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#pairwise-sorting .error-icon{fill:#ffffff;}#pairwise-sorting .error-text{fill:#000000;stroke:#000000;}#pairwise-sorting .edge-thickness-normal{stroke-width:1px;}#pairwise-sorting .edge-thickness-thick{stroke-width:3.5px;}#pairwise-sorting .edge-pattern-solid{stroke-dasharray:0;}#pairwise-sorting .edge-thickness-invisible{stroke-width:0;fill:none;}#pairwise-sorting .edge-pattern-dashed{stroke-dasharray:3;}#pairwise-sorting .edge-pattern-dotted{stroke-dasharray:2;}#pairwise-sorting .marker{fill:#555555;stroke:#555555;}#pairwise-sorting .marker.cross{stroke:#555555;}#pairwise-sorting svg{font-family:Arial,sans-serif;font-size:16px;}#pairwise-sorting p{margin:0;}#pairwise-sorting .label{font-family:Arial,sans-serif;color:#171717;}#pairwise-sorting .cluster-label text{fill:#000000;}#pairwise-sorting .cluster-label span{color:#000000;}#pairwise-sorting .cluster-label span p{background-color:transparent;}#pairwise-sorting .label text,#pairwise-sorting span{fill:#171717;color:#171717;}#pairwise-sorting .node rect,#pairwise-sorting .node circle,#pairwise-sorting .node ellipse,#pairwise-sorting .node polygon,#pairwise-sorting .node path{fill:#f3f3f3;stroke:#555555;stroke-width:1px;}#pairwise-sorting .rough-node .label text,#pairwise-sorting .node .label text,#pairwise-sorting .image-shape .label,