name: Integrated beta verification
on:
  pull_request:
  push:
    branches: [main, codex/integrated-beta, codex/plan-vnext]
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install lockfile-matched Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify syntax and whitespace
        run: |
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          git diff --check
      - name: Run complete browser, SQLite and HTTP suite
        run: |
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          npm test
