<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Sorter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
            position: relative;
        }

        /* Essential utility class - !important prevents display:flex overrides */
        .hidden {
            display: none !important;
        }

        button {
            margin: 5px 0;
            padding: 8px 12px;
            cursor: pointer;
        }

        input, textarea {
            margin: 5px 0;
            padding: 6px;
            display: block;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .checkbox-container, .upload-container {
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .upload-container {
            border: 1px dashed #ccc;
            background: #fafafa;
        }

        /* Side-by-side layout for explicit index inserting */
        .insertion-layout {
            display: flex;
            gap: 40px;
            margin-top: 15px;
        }

        .insertion-column {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }

        .over-capacity {
            color: #d32f2f;
        }

        /* Top right positioning for header action buttons */
        #stopWorkingBtn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #ffcdd2;
            border: 1px solid #e53935;
            color: #b71c1c;
            font-weight: bold;
            border-radius: 4px;
        }

        #startOverBtn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #eceff1;
            border: 1px solid #90a4ae;
            color: #37474f;
            border-radius: 4px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px; /* Fixed camelCase bug */
            max-width: 320px;
            width: 85%;
            text-align: center;
        }

        .modal-btn {
            display: block;
            width: 100%;
            margin: 8px 0;
        }

        .modal-btn-cancel {
            background-color: #eceff1;
        }
    </style>
</head>
<body>
    <button id="stopWorkingBtn" class="hidden">Stop Working</button>
    <button id="startOverBtn" class="hidden">Start Over</button>

    <h1>Task Sorter</h1>
    
    <!-- Step 1: Mode Selection -->
    <div id="modeSelect">
        <button id="workBtn">Work</button>
        <button id="planBtn" disabled>Plan <i>(Coming Soon)</i></button>
    </div>

    <!-- Step 2: New List vs. Resume Existing List -->
    <div id="workChoiceStep" class="hidden">
        <h2>What do you want to do?</h2>
        <button id="createNewListBtn">Create a New Task List</button>
        <button id="resumeExistingListBtn">Resume Existing List</button>
    </div>

    <!-- Step 3: Time & Constraint Entry Screen -->
    <div id="timeConstraintInput" class="hidden">
        <h2>Set Up Your Time</h2>
        <label for="availableTime">How much time do you have to work? (in minutes)</label>
        <input type="number" id="availableTime" placeholder="e.g., 45" min="1">

        <label for="endConstraint">What happens when this time is up?</label>
        <input type="text" id="endConstraint" placeholder="e.g., class ends, leave for appointment">

        <button id="timeConstraintNextBtn">Next</button>
    </div>

    <!-- Step 4: Task Entry Screen -->
    <div id="taskInput" class="hidden">
        <h2>Enter Your Tasks</h2>
        <textarea id="tasks" rows="10" cols="40" placeholder="Enter one task per line"></textarea>
        
        <div class="checkbox-container">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="skipSortCheckbox" style="width: auto;"> Skip sorting (use current order)
            </label>
        </div>
        <button id="startSort">Start Sorting</button>

        <div class="upload-container">
            <h3>Or Import a Saved List</h3>
            <input type="file" id="csvUpload" accept=".csv">
        </div>
    </div>

    <div id="taskCompare" class="hidden">
        <h2>Which task comes first?</h2>
        <button id="task1"></button>
        <button id="task2"></button>
    </div>

    <div id="dynamicContainer"></div>

    <div id="startOverModal" class="modal-overlay hidden">
        <div class="modal-box">
            <p><strong>What would you like to do?</strong></p>
            <button id="restartStepBtn" class="modal-btn">Restart This Step</button>
            <button id="restartAllBtn" class="modal-btn">Restart From the Beginning</button>
            <button id="cancelModalBtn" class="modal-btn modal-btn-cancel">Cancel</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
