<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Sorter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; position: relative; }
        .hidden { display: none; }
        button { margin: 5px 0; padding: 8px 12px; cursor: pointer; }
        input, textarea { margin: 5px 0; padding: 6px; display: block; width: 100%; max-width: 400px; box-sizing: border-box; }
        .checkbox-container, .upload-container { margin: 15px 0; padding: 10px; border-radius: 4px; }
        .upload-container { border: 1px dashed #ccc; background: #fafafa; }
        #stopWorkingBtn, #startOverBtn { position: absolute; top: 0; right: 0; border-radius: 4px; }
        #stopWorkingBtn { background-color: #ffcdd2; border: 1px solid #e53935; color: #b71c1c; font-weight: bold; border-radius: 4px; }
        #startOverBtn { background-color: #eceff1; border: 1px solid #90a4ae; color: #37474f; border-radius: 4px; }

        /* Project Planner */
        .planner-choice-grid { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
        .planner-choice-grid > button, .planner-list > button {
            display: block; width: 100%; max-width: 520px; padding: 14px; text-align: left;
            border: 1px solid #b7d7bb; border-radius: 6px; background: #f1f8f2; font-weight: bold;
        }
        .planner-choice-grid > button span { display: block; margin-top: 4px; color: #666; font-size: 12px; font-weight: normal; }
        .planner-secondary { background: #eceff1; border: 1px solid #b0bec5; }
        .planner-check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .planner-check input { width: auto; margin: 2px 0 0; }
        .planner-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
        .planner-project-row { padding: 12px 0; border-bottom: 1px solid #ddd; }
        .planner-project-link { padding: 0; margin: 0 0 4px; border: 0; background: none; color: #1565c0; text-decoration: underline; font-size: 16px; font-weight: bold; }
        .planner-project-row span { display: block; color: #666; font-size: 13px; }
        .planner-callout { padding: 14px; background: #fff8e1; border: 1px solid #ffcc80; border-radius: 6px; }
        .planner-insert { display: block; margin: 7px 0; padding: 5px 8px; font-size: 12px; }
        .planner-order-row { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .planner-moving { margin-top: 12px; padding: 10px; background: #f1f8e9; border-radius: 4px; }
    </style>
</head>
<body>
    <button id="stopWorkingBtn" class="hidden">Stop Working</button>
    <button id="startOverBtn" class="hidden">Start Over</button>
    <h1>Task Sorter</h1>
    <div id="modeSelect">
        <button id="workBtn">Work</button>
        <button id="planBtn">Plan</button>
    </div>
    <div id="workChoiceStep" class="hidden">
        <h2>What do you want to do?</h2>
        <button id="createNewListBtn">Create a New Task List</button>
        <button id="resumeExistingListBtn">Resume Existing List</button>
    </div>
    <div id="timeConstraintInput" class="hidden">
        <h2>Set Up Your Time</h2>
        <label for="availableTime">How much time do you have to work? (in minutes)</label>
        <input type="number" id="availableTime" placeholder="e.g., 45" min="1">
        <label for="endConstraint">What happens when this time is up?</label>
        <input type="text" id="endConstraint" placeholder="e.g., class ends, leave for appointment">
        <button id="timeConstraintNextBtn">Next</button>
    </div>
    <div id="taskInput" class="hidden">
        <h2>Enter Your Tasks</h2>
        <textarea id="tasks" rows="10" cols="40" placeholder="Enter one task per line or separate tasks with commas"></textarea>
        <div class="checkbox-container">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="skipSortCheckbox" style="width: auto;"> Skip sorting (use current order)
            </label>
        </div>
        <button id="startSort">Start Sorting</button>
        <div class="upload-container">
            <h3>Or Import a Saved List</h3>
            <input type="file" id="csvUpload" accept=".txt,.csv,text/plain,text/csv">
        </div>
    </div>
    <div id="taskCompare" class="hidden">
        <h2>Which task comes first?</h2>
        <button id="task1"></button>
        <button id="task2"></button>
    </div>
    <div id="dynamicContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js" onerror="console.warn('CSV helper unavailable; using built-in parser.')"></script>
    <script src="frontend/initialization.js?v=20260810-plan"></script>
    <script src="frontend/persistence.js?v=20260810-plan"></script>
    <script src="frontend/ui.js?v=20260810-plan"></script>
    <script src="frontend/core.js?v=20260810-plan"></script>
    <script src="frontend/timing.js?v=20260810-plan"></script>
    <script src="frontend/work-planner.js?v=20260811-project-launch-1"></script>
    <script src="frontend/planner.js?v=20260811-backlog-manage-1"></script>
    <script src="frontend/project-editor.js?v=20260812-task-insert-1"></script>
    <script src="frontend/project-csv.js?v=20260811-plan-6b"></script>
    <script src="frontend/planner-bridge.js?v=20260810-plan-2"></script>
</body>
</html>
