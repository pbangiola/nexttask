<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Sorter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 800px;
            position: relative;
        }
        .hidden {
            display: none;
        }
        button {
            margin: 5px 0;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
        }
        button:hover {
            background: #f5f5f5;
        }
        input, textarea {
            margin: 5px 0;
            padding: 6px;
            display: block;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .checkbox-container {
            margin: 15px 0;
        }
        .upload-container {
            border: 2px dashed #ccc;
            background: #fafafa;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            margin-top: 20px;
        }
        .insertion-layout {
            display: flex;
            gap: 40px;
            margin-top: 15px;
        }
        .insertion-column {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .over-capacity {
            color: #d32f2f;
        }
        /* Top right positioning for Stop Working */
        #stopWorkingBtn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #ffcdd2;
            border: 1px solid #e53935;
            color: #b71c1c;
            font-weight: bold;
        }
        #stopWorkingBtn:hover {
            background-color: #ef9a9a;
        }
        .timeout-banner {
            background: #fff3e0;
            color: #e65100;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
        .hyperlink-style {
            color: #0288d1;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="stopWorkingBtn" class="hidden">Stop Working</button>

    <h1>Task Sorter</h1>
    
    <!-- Step 1: Mode Selection -->
    <div id="modeSelect">
        <button id="workBtn">Work</button>
        <button id="planBtn" disabled>Plan <i>(Coming Soon)</i></button>
    </div>

    <!-- NEW Step 2: Time & Constraint Entry Screen -->
    <div id="timeConstraintInput" class="hidden">
        <h2>Session Setup</h2>
        <label for="availableTime">How much time do you have to work? (in minutes)</label>
        <input type="number" id="availableTime" placeholder="e.g., 45" min="1">

        <label for="endConstraint">What happens when this time is up?</label>
        <input type="text" id="endConstraint" placeholder="e.g., class ends, leave for appointment">

        <button id="timeConstraintNextBtn">Next</button>
    </div>

    <!-- Step 3: Task Entry Screen -->
    <div id="taskInput" class="hidden">
        <h2>Enter Your Tasks</h2>
        <textarea id="tasksTextarea" rows="10" placeholder="Enter one task instruction entry per line..."></textarea>
        
        <div class="checkbox-container">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="skipSortCheckbox" style="width: auto;"> Skip sorting (use current order)
            </label>
        </div>
        <button id="btnSubmitText">Start Sorting</button>

        <div class="upload-container">
            <h3>Or Resume Previous Session</h3>
            <input type="file" id="csvFileInput" accept=".csv">
        </div>
    </div>

    <div id="dynamicContainer"></div>

    <div id="taskCompare" class="hidden">
        <h2>Which task comes first?</h2>
        <div class="choice-box-container">
            <div id="task1" class="forced-choice-box"></div>
            <div id="task2" class="forced-choice-box"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
