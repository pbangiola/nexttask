<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Sorter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; position: relative; }
        .hidden { display: none; }
        button { margin: 5px 0; padding: 8px 12px; cursor: pointer; }
        input, textarea { margin: 5px 0; padding: 6px; display: block; width: 100%; max-width: 400px; box-sizing: border-box; }
        .checkbox-container, .upload-container { margin: 15px 0; padding: 10px; border-radius: 4px; }
        .upload-container { border: 1px dashed #ccc; background: #fafafa; }
        #stopWorkingBtn, #startOverBtn { position: absolute; top: 0; right: 0; border-radius: 4px; }
        #stopWorkingBtn { background-color: #ffcdd2; border: 1px solid #e53935; color: #b71c1c; font-weight: bold; }
        #startOverBtn { background-color: #eceff1; border: 1px solid #90a4ae; color: #37474f; }
    </style>
</head>
<body>
    <button id="stopWorkingBtn" class="hidden">Stop Working</button>
    <button id="startOverBtn" class="hidden">Start Over</button>
    <h1>Task Sorter</h1>
    <div id="modeSelect">
        <button id="workBtn">Work</button>
        <button id="planBtn" disabled>Plan <i>(Coming Soon)</i></button>
    </div>
    <div id="workChoiceStep" class="hidden">
        <h2>What do you want to do?</h2>
        <button id="createNewListBtn">Create a New Task List</button>
        <button id="resumeExistingListBtn">Resume Existing List</button>
    </div>
    <div id="timeConstraintInput" class="hidden">
        <h2>Set Up Your Time</h2>
        <label for="availableTime">How much time do you have to work? (in minutes)</label>
        <input type="number" id="availableTime" placeholder="e.g., 45" min="1">
        <label for="endConstraint">What happens when this time is up?</label>
        <input type="text" id="endConstraint" placeholder="e.g., class ends, leave for appointment">
        <button id="timeConstraintNextBtn">Next</button>
    </div>
    <div id="taskInput" class="hidden">
        <h2>Enter Your Tasks</h2>
        <textarea id="tasks" rows="10" cols="40" placeholder="Enter one task per line or separate tasks with commas"></textarea>
        <div class="checkbox-container">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="skipSortCheckbox" style="width: auto;"> Skip sorting (use current order)
            </label>
        </div>
        <button id="startSort">Start Sorting</button>
        <div class="upload-container">
            <h3>Or Import a Saved List</h3>
            <input type="file" id="csvUpload" accept=".txt,.csv,text/plain,text/csv">
        </div>
    </div>
    <div id="taskCompare" class="hidden">
        <h2>Which task comes first?</h2>
        <button id="task1"></button>
        <button id="task2"></button>
    </div>
    <div id="dynamicContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js" onerror="console.warn('CSV helper unavailable; using built-in parser.')"></script>
    <script src="script.js</script>
</body>
</html>
